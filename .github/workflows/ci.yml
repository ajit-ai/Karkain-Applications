# CI — Karkain-Applications laboratory validation.
# Runs the repository's established checks without weakening them:
#   1. tools/check-matrix.ps1 (Windows: structural + capability-ID gates)
#   2. Sphinx HTML documentation build with -W (warnings are errors)
# Application execution verification (verify-apps.ps1 / verify-service.ps1)
# is intentionally NOT in CI: it requires the separate Karkain toolchain
# (karkain.exe, Windows) from https://github.com/ajit-ai/Karkain plus a
# pristine-HEAD workaround for unrelated in-progress compiler work.
# See docs/release.rst. Those verifications run locally on Windows.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  matrix:
    name: capability matrix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run check-matrix.ps1
        shell: pwsh
        run: ./tools/check-matrix.ps1

  docs:
    name: Sphinx HTML docs (-W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install doc dependencies
        run: pip install -r docs/requirements-docs.txt
      - name: Build HTML documentation
        run: sphinx-build -b html -W docs docs/_build/html
