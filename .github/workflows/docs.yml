# GitHub Pages — publish the Sphinx laboratory documentation.
# Trigger: pushes to main (the release branch) or manual dispatch.
# Mechanism: official GitHub Pages Actions (configure/upload/deploy).
# Published URL: https://ajit-ai.github.io/Karkain-Applications/
# (repository Pages must be set to "GitHub Actions" source once).
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install doc dependencies
        run: pip install -r docs/requirements-docs.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build HTML documentation
        run: sphinx-build -b html -W docs docs/_build/html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
